openapi: 3.1.0
info:
  title: Sree Collections API
  version: 0.1.0
  description: |
    Storefront, account and staff API for Sree Collections.

    Base path: `/api/v1`. All responses are JSON except the invoice endpoint, which returns HTML.

    **Authentication** uses the HttpOnly `sc_session` cookie created by `/auth/login`.
    Guests receive an HttpOnly `sc_cart` cookie.

    **CSRF**: every `POST`, `PATCH`, `PUT` and `DELETE` requires the `x-csrf-token` header to match
    the `sc_csrf` cookie. Make any GET request first if the cookie does not exist yet. The `CsrfToken`
    parameter is listed on every mutating operation.

    **Origin**: mutating requests that send an `Origin` header must match the server's `APP_ORIGIN`.

    **Money** is integer paise throughout (₹1,499.00 = `149900`). Timestamps are UTC ISO-8601.

    This specification is a hand-maintained reference. The route handlers in `server/routes/` are
    the source of truth; see `docs/API.md` for narrative details and role matrix.
servers:
  - url: /api/v1
tags:
  - name: Health
  - name: Auth
  - name: Catalogue
  - name: Cart
  - name: Checkout
  - name: Account
  - name: Content
  - name: Admin
paths:
  /health:
    get:
      tags: [Health]
      summary: Service and capability status
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /auth/session:
    get:
      tags: [Auth]
      summary: Current session user
      responses:
        '200':
          description: Current user or null
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    oneOf:
                      - $ref: '#/components/schemas/User'
                      - type: 'null'

  /auth/register:
    post:
      tags: [Auth]
      summary: Create a customer account and start a session
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          description: Account created; guest cart merged
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in and merge the guest cart
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 160 }
                password: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Destroy the current session
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Signed out
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }

  /auth/password:
    post:
      tags: [Auth]
      summary: Change password (revokes other sessions)
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 10 }
      responses:
        '200':
          description: Password changed
        '400':
          description: Current password invalid or new password too weak
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/password/forgot:
    post:
      tags: [Auth]
      summary: Password recovery (not available)
      description: Always returns 503 because no email provider is configured.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '503':
          description: Email provider not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /catalog/categories:
    get:
      tags: [Catalogue]
      summary: Active categories with product counts
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'

  /catalog/meta:
    get:
      tags: [Catalogue]
      summary: Filter and sort metadata
      responses:
        '200':
          description: Occasions, recipients, budgets, tags and sort options
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /catalog/products:
    get:
      tags: [Catalogue]
      summary: List published products
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 80 } }
        - { name: category, in: query, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: minPrice, in: query, description: Rupees, schema: { type: number, minimum: 0 } }
        - { name: maxPrice, in: query, description: Rupees, schema: { type: number, minimum: 0 } }
        - name: sort
          in: query
          schema:
            type: string
            enum: [featured, newest, price_asc, price_desc, rating, bestselling, discount]
        - { name: personalizable, in: query, schema: { type: boolean } }
        - { name: giftWrap, in: query, schema: { type: boolean } }
        - { name: inStock, in: query, schema: { type: boolean } }
        - { name: featured, in: query, schema: { type: boolean } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 48, default: 12 } }
      responses:
        '200':
          description: Paged products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'

  /catalog/products/{slug}:
    get:
      tags: [Catalogue]
      summary: Product detail
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Product with images, variants, reviews and related products
          content:
            application/json:
              schema:
                type: object
                properties:
                  product:
                    $ref: '#/components/schemas/Product'
                  related:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductSummary'
                  returns:
                    type: object
                    additionalProperties: true
        '404':
          $ref: '#/components/responses/NotFound'

  /catalog/products/{slug}/reviews:
    get:
      tags: [Catalogue]
      summary: Approved reviews for a product
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Reviews and rating summary
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /catalog/gift-finder:
    get:
      tags: [Catalogue]
      summary: Live-catalogue gift recommendations
      parameters:
        - { name: occasion, in: query, schema: { type: string } }
        - { name: recipient, in: query, schema: { type: string } }
        - { name: maxBudget, in: query, schema: { type: number, minimum: 0 } }
        - { name: personalizable, in: query, schema: { type: boolean } }
        - { name: giftWrap, in: query, schema: { type: boolean } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 48 } }
      responses:
        '200':
          description: Recommendations with a note that they are not sponsored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'

  /catalog/search/suggestions:
    get:
      tags: [Catalogue]
      summary: Product and category suggestions
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 60 } }
      responses:
        '200':
          description: Suggestions and popular queries
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    items: { type: string }
                  popular:
                    type: array
                    items: { type: string }

  /catalog/delivery/check:
    get:
      tags: [Catalogue]
      summary: Serviceability and fee for a PIN code
      parameters:
        - { name: pincode, in: query, required: true, schema: { type: string, pattern: '^[1-9][0-9]{5}$' } }
      responses:
        '200':
          description: Shipping quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShippingQuote'
        '400':
          $ref: '#/components/responses/ValidationError'

  /cart:
    get:
      tags: [Cart]
      summary: Current cart with server quote
      responses:
        '200':
          description: Cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
    delete:
      tags: [Cart]
      summary: Empty the cart
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Emptied cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'

  /cart/items:
    post:
      tags: [Cart]
      summary: Add an item
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItemInput'
      responses:
        '201':
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          $ref: '#/components/responses/ValidationError'

  /cart/items/{id}:
    patch:
      tags: [Cart]
      summary: Update quantity, gift wrap or personalisation
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity: { type: integer, minimum: 1, maximum: 20 }
                giftWrap: { type: boolean }
                giftMessage: { type: string, maxLength: 180 }
                personalization: { type: object, additionalProperties: { type: string } }
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
    delete:
      tags: [Cart]
      summary: Remove an item
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'

  /cart/coupon:
    post:
      tags: [Cart]
      summary: Apply a coupon
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, maxLength: 40 }
      responses:
        '200':
          description: Cart with coupon result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
    delete:
      tags: [Cart]
      summary: Remove the coupon
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Cart without coupon
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'

  /cart/shipping:
    post:
      tags: [Cart]
      summary: Set the delivery PIN and re-quote
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pincode]
              properties:
                pincode: { type: string, pattern: '^[1-9][0-9]{5}$' }
      responses:
        '200':
          description: Cart with shipping quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          $ref: '#/components/responses/ValidationError'

  /checkout:
    post:
      tags: [Checkout]
      summary: Place an order from the current cart (COD)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutInput'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    $ref: '#/components/schemas/Order'
                  idempotent: { type: boolean }
                  notificationChannels:
                    type: array
                    items:
                      type: object
                      properties:
                        channel: { type: string, enum: [email_customer, email_owner] }
                        status: { type: string, enum: [queued, sent, failed, not_configured] }
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Online payment or provider unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /orders/track:
    get:
      tags: [Checkout]
      summary: Track an order by number and checkout email
      description: Email may be omitted when signed in as the order owner.
      parameters:
        - { name: orderNumber, in: query, required: true, schema: { type: string } }
        - { name: email, in: query, schema: { type: string, format: email } }
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders/{orderNumber}:
    get:
      tags: [Checkout]
      summary: Order detail
      parameters:
        - $ref: '#/components/parameters/OrderNumber'
        - { name: email, in: query, schema: { type: string, format: email } }
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders/{orderNumber}/invoice:
    get:
      tags: [Checkout]
      summary: Printable invoice
      parameters:
        - $ref: '#/components/parameters/OrderNumber'
        - { name: email, in: query, schema: { type: string, format: email } }
      responses:
        '200':
          description: HTML invoice
          content:
            text/html:
              schema: { type: string }
        '404':
          $ref: '#/components/responses/NotFound'

  /orders/{orderNumber}/invoice.pdf:
    get:
      tags: [Checkout]
      summary: Invoice PDF
      parameters:
        - $ref: '#/components/parameters/OrderNumber'
        - { name: email, in: query, schema: { type: string, format: email } }
      responses:
        '200':
          description: PDF invoice
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '404':
          $ref: '#/components/responses/NotFound'

  /account:
    get:
      tags: [Account]
      summary: Profile and activity counts
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Profile and counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  counts:
                    type: object
                    additionalProperties: { type: integer }
    patch:
      tags: [Account]
      summary: Update name and phone
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 2, maxLength: 80 }
                phone:
                  type: string
                  pattern: '^[6-9][0-9]{9}$'
                  description: Indian mobile number; +91 and separators are normalised
      responses:
        '200':
          description: Updated profile
        '400':
          $ref: '#/components/responses/ValidationError'

  /account/addresses:
    get:
      tags: [Account]
      summary: List saved addresses
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Addresses
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Address'
    post:
      tags: [Account]
      summary: Create an address
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  address:
                    $ref: '#/components/schemas/Address'

  /account/addresses/{id}:
    patch:
      tags: [Account]
      summary: Update an address
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInput'
      responses:
        '200':
          description: Updated
    delete:
      tags: [Account]
      summary: Delete an address
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Deleted

  /account/addresses/{id}/default:
    post:
      tags: [Account]
      summary: Mark an address as default
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Default address updated

  /account/orders:
    get:
      tags: [Account]
      summary: Customer order history
      security:
        - sessionCookie: []
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 20 } }
      responses:
        '200':
          description: Paged orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  total: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }
                  pages: { type: integer }

  /account/orders/{orderNumber}:
    get:
      tags: [Account]
      summary: Own order detail
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/OrderNumber'
      responses:
        '200':
          description: Order
        '404':
          $ref: '#/components/responses/NotFound'

  /account/orders/{orderNumber}/cancel:
    post:
      tags: [Account]
      summary: Cancel a pending or confirmed order
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/OrderNumber'
      responses:
        '200':
          description: Cancelled order (stock restored)
        '409':
          description: Order can no longer be cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /account/wishlist:
    get:
      tags: [Account]
      summary: Saved products
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Wishlist
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductSummary'

  /account/wishlist/{productId}:
    post:
      tags: [Account]
      summary: Add a product to the wishlist
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - { name: productId, in: path, required: true, schema: { type: string } }
      responses:
        '201':
          description: Added
    delete:
      tags: [Account]
      summary: Remove a product from the wishlist
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - { name: productId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Removed

  /account/reviews:
    get:
      tags: [Account]
      summary: Own reviews
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Reviews
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      tags: [Account]
      summary: Submit a purchase-gated review for moderation
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewInput'
      responses:
        '202':
          description: Awaiting moderation
        '400':
          $ref: '#/components/responses/ValidationError'

  /account/returns:
    get:
      tags: [Account]
      summary: Own return requests
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Return requests
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      tags: [Account]
      summary: Request a return for an order item
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnInput'
      responses:
        '201':
          description: Return request recorded
        '400':
          $ref: '#/components/responses/ValidationError'

  /content/site:
    get:
      tags: [Content]
      summary: Store settings, attributed public listing, policies and capability labels
      responses:
        '200':
          description: Site content
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /content/home:
    get:
      tags: [Content]
      summary: Home page content and curated collections
      responses:
        '200':
          description: Home content
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /content/support/tickets:
    post:
      tags: [Content]
      summary: Save a contact message
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, subject, message]
              properties:
                name: { type: string, minLength: 2, maxLength: 80 }
                email: { type: string, format: email, maxLength: 160 }
                subject: { type: string, minLength: 3, maxLength: 120 }
                message: { type: string, minLength: 10, maxLength: 3000 }
                orderNumber: { type: string, maxLength: 30 }
      responses:
        '201':
          description: Ticket saved; no automated email is sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticketNumber: { type: string }
                  message: { type: string }

  /content/newsletter:
    post:
      tags: [Content]
      summary: Record newsletter consent
      description: Delivery is not configured; the response says so.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, consent]

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sc_session
  parameters:
    CsrfToken:
      name: x-csrf-token
      in: header
      required: true
      description: Must equal the `sc_csrf` cookie value.
      schema: { type: string }
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string }
    OrderNumber:
      name: orderNumber
      in: path
      required: true
      schema: { type: string, example: SC-20261024-ABC123 }
  responses:
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Role or CSRF/origin check failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string }
            details:
              oneOf:
                - type: 'null'
                - type: array
                  items:
                    type: object
                    properties:
                      field: { type: string }
                      message: { type: string }
    Health:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string }
        environment: { type: string }
        database: { type: string, enum: [ok, error] }
        uptimeSeconds: { type: number }
        integrations:
          type: object
          properties:
            onlinePayments: { type: string, enum: [not_configured, configured_unverified] }
            email: { type: string, enum: [not_configured, configured_unverified] }
            courier: { type: string, enum: [not_configured, configured_unverified] }
            routeDistance: { type: string, enum: [not_configured, configured_unverified] }
    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        phone: { type: [string, 'null'] }
        role:
          type: string
          enum: [customer, owner, admin, catalogue, orders, support, finance]
    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        email: { type: string, format: email, maxLength: 160 }
        phone: { type: string, pattern: '^[6-9][0-9]{9}$' }
        password: { type: string, minLength: 10 }
    Category:
      type: object
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        sort_order: { type: integer }
        product_count: { type: integer }
    ProductSummary:
      type: object
      properties:
        id: { type: string }
        slug: { type: string }
        sku: { type: string }
        name: { type: string }
        shortDescription: { type: string }
        category:
          type: object
          properties:
            slug: { type: string }
            name: { type: string }
        price: { type: integer }
        compareAt: { type: [integer, 'null'] }
        discountPercent: { type: integer }
        image: { type: [string, 'null'] }
        imageAlt: { type: string }
        inStock: { type: boolean }
        stock: { type: integer }
        stockLabel: { type: string }
        variantCount: { type: integer }
        featured: { type: boolean }
        personalizable: { type: boolean }
        giftWrappable: { type: boolean }
        rating:
          type: object
          properties:
            average: { type: number }
            count: { type: integer }
        tags:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
    Product:
      allOf:
        - $ref: '#/components/schemas/ProductSummary'
        - type: object
          properties:
            description: { type: string }
            seoTitle: { type: string }
            seoDescription: { type: string }
            images:
              type: array
              items:
                type: object
                properties:
                  url: { type: string }
                  alt: { type: string }
            variants:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string }
                  sku: { type: string }
                  price: { type: integer }
                  stock: { type: integer }
                  inStock: { type: boolean }
            specifications:
              type: object
              properties:
                weightGrams: { type: integer }
                dimensions:
                  type: object
                  properties:
                    lengthMm: { type: integer }
                    widthMm: { type: integer }
                    heightMm: { type: integer }
                hsnCode: { type: [string, 'null'] }
                taxRateBps: { type: integer }
                preparationDays: { type: integer }
                returnEligible: { type: boolean }
                fragile: { type: boolean }
                giftWrappable: { type: boolean }
                personalizable: { type: boolean }
            ratingBreakdown:
              type: array
              items:
                type: object
                properties:
                  stars: { type: integer }
                  count: { type: integer }
    ProductPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductSummary'
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        pages: { type: integer }
        explanation:
          type: string
          description: Present on gift-finder results only
    ShippingQuote:
      type: object
      properties:
        serviceable: { type: boolean }
        pincode: { type: string }
        zoneName: { type: [string, 'null'] }
        fee: { type: integer }
        freeAbove: { type: [integer, 'null'] }
        freeApplied: { type: boolean }
        etaDaysMin: { type: [integer, 'null'] }
        etaDaysMax: { type: [integer, 'null'] }
        message: { type: string }
    CartItemInput:
      type: object
      required: [productId]
      properties:
        productId: { type: string }
        variantId: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 20, default: 1 }
        giftWrap: { type: boolean, default: false }
        giftMessage: { type: string, maxLength: 180 }
        personalization:
          type: object
          additionalProperties: { type: string }
    Cart:
      type: object
      properties:
        cart:
          $ref: '#/components/schemas/CartQuote'
    CartQuote:
      type: object
      properties:
        id: { type: string }
        couponCode: { type: [string, 'null'] }
        shippingPincode: { type: [string, 'null'] }
        lines:
          type: array
          items:
            type: object
            additionalProperties: true
        itemCount: { type: integer }
        uniqueItems: { type: integer }
        subtotal: { type: integer }
        discount: { type: integer }
        giftWrapTotal: { type: integer }
        shipping:
          oneOf:
            - $ref: '#/components/schemas/ShippingQuote'
            - type: 'null'
        shippingFee: { type: integer }
        codFee: { type: integer }
        taxIncluded: { type: integer }
        taxExclusive: { type: integer }
        taxMode: { type: string, enum: [inclusive, exclusive] }
        total: { type: integer }
        currency: { type: string, const: INR }
        coupon:
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
        couponError: { type: [string, 'null'] }
        issues:
          type: array
          items: { type: string }
        requiresShipping: { type: boolean }
        paymentMethods:
          type: array
          items:
            type: object
            properties:
              id: { type: string, enum: [cod, online] }
              label: { type: string }
              available: { type: boolean }
              reason: { type: string }
    AddressInput:
      type: object
      required: [recipient, phone, line1, city, state, pincode]
      properties:
        label: { type: string, maxLength: 30 }
        recipient: { type: string, minLength: 2, maxLength: 80 }
        phone: { type: string, pattern: '^[6-9][0-9]{9}$' }
        line1: { type: string, minLength: 5, maxLength: 160 }
        line2: { type: string, maxLength: 160 }
        city: { type: string, minLength: 2, maxLength: 80 }
        state: { type: string, minLength: 2, maxLength: 80 }
        pincode: { type: string, pattern: '^[1-9][0-9]{5}$' }
        isDefault: { type: boolean }
    Address:
      allOf:
        - $ref: '#/components/schemas/AddressInput'
        - type: object
          properties:
            id: { type: string }
            createdAt: { type: string, format: date-time }
    CheckoutInput:
      type: object
      required: [contact, shippingAddress, acceptTerms]
      properties:
        contact:
          type: object
          required: [name, email, phone]
          properties:
            name: { type: string, minLength: 2, maxLength: 80 }
            email: { type: string, format: email, maxLength: 160 }
            phone: { type: string, pattern: '^[6-9][0-9]{9}$' }
        shippingAddress:
          $ref: '#/components/schemas/AddressInput'
        billingSameAsShipping: { type: boolean, default: true }
        billingAddress:
          $ref: '#/components/schemas/AddressInput'
        couponCode: { type: string, maxLength: 40 }
        paymentMethod: { type: string, enum: [cod, online], default: cod }
        giftMessage: { type: string, maxLength: 180 }
        customerNote: { type: string, maxLength: 500 }
        idempotencyKey: { type: string, minLength: 8, maxLength: 100 }
        acceptTerms: { type: boolean, const: true }
    Order:
      type: object
      properties:
        id: { type: string }
        orderNumber: { type: string }
        customer: { type: string }
        email: { type: string }
        phone: { type: string }
        status:
          type: string
          enum: [pending, confirmed, packed, shipped, delivered, cancelled, returned]
        paymentMethod: { type: string, enum: [cod, online] }
        paymentStatus: { type: string, enum: [cod_pending, paid, failed, refunded] }
        subtotal: { type: integer }
        discount: { type: integer }
        giftWrapTotal: { type: integer }
        shippingFee: { type: integer }
        taxIncluded: { type: integer }
        taxExclusive: { type: integer }
        total: { type: integer }
        currency: { type: string }
        couponCode: { type: [string, 'null'] }
        shippingAddress:
          $ref: '#/components/schemas/Address'
        billingAddress:
          $ref: '#/components/schemas/Address'
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        events:
          type: array
          items:
            type: object
            additionalProperties: true
        trackingNumber: { type: [string, 'null'] }
        trackingUrl: { type: [string, 'null'] }
        delivery:
          type: object
          properties:
            pincode: { type: string }
            zone: { type: [string, 'null'] }
            etaDaysMin: { type: [integer, 'null'] }
            etaDaysMax: { type: [integer, 'null'] }
        createdAt: { type: string, format: date-time }
        notifications:
          type: object
          properties:
            email: { type: string, enum: [not_configured, configured, queued, sent, failed] }
            sms: { type: string, const: not_configured }
            whatsapp: { type: string, enum: [not_configured, click_to_chat] }
            whatsappNumber: { type: string }
            whatsappAutoOpen: { type: boolean }
    ReviewInput:
      type: object
      required: [orderNumber, productId, rating, body]
      properties:
        orderNumber: { type: string }
        productId: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        title: { type: string, maxLength: 80 }
        body: { type: string, minLength: 10, maxLength: 1500 }
    ReturnInput:
      type: object
      required: [orderNumber, orderItemId, reason]
      properties:
        orderNumber: { type: string }
        orderItemId: { type: string }
        reason:
          type: string
          enum: [damaged, wrong_item, not_as_described, changed_mind, other]
        detail: { type: string, maxLength: 1000 }
    ProductInput:
      type: object
      required: [name, sku, categoryId, price]
      properties:
        name: { type: string, minLength: 2, maxLength: 140 }
        slug:
          type: string
          maxLength: 80
          pattern: '^[a-z0-9-]+$'
          description: Optional; generated from the name when absent
        sku: { type: string, minLength: 2, maxLength: 60 }
        categoryId: { type: string }
        shortDescription: { type: string, maxLength: 300, default: '' }
        description: { type: string, maxLength: 6000, default: '' }
        price: { type: integer, minimum: 1 }
        salePrice: { type: [integer, 'null'], minimum: 0 }
        mrp: { type: [integer, 'null'], minimum: 0 }
        costPrice: { type: [integer, 'null'], minimum: 0 }
        taxRateBps: { type: integer, minimum: 0, maximum: 2800, default: 500 }
        hsnCode: { type: string, maxLength: 20 }
        stockQuantity: { type: integer, minimum: 0, maximum: 1000000, default: 0 }
        lowStockThreshold: { type: integer, minimum: 0, maximum: 10000, default: 5 }
        weightG: { type: integer, minimum: 0, maximum: 100000, default: 400 }
        status:
          type: string
          enum: [draft, scheduled, published, unpublished, archived, discontinued]
          default: draft
        featured: { type: boolean, default: false }
        giftWrappable: { type: boolean, default: true }
        personalizable: { type: boolean, default: false }
        returnEligible: { type: boolean, default: true }
        fragile: { type: boolean, default: false }
        tags:
          type: array
          maxItems: 30
          items: { type: string, maxLength: 30 }
        imageAlt: { type: string, maxLength: 200 }
        seoTitle: { type: string, maxLength: 160 }
        seoDescription: { type: string, maxLength: 300 }
        searchKeywords: { type: string, maxLength: 500 }
        lengthMm: { type: integer, minimum: 0, maximum: 100000, default: 0 }
        widthMm: { type: integer, minimum: 0, maximum: 100000, default: 0 }
        heightMm: { type: integer, minimum: 0, maximum: 100000, default: 0 }
        preparationDays: { type: integer, minimum: 0, maximum: 90, default: 1 }
        images:
          type: array
          maxItems: 10
          items:
            type: object
            required: [url, alt]
            properties:
              url:
                type: string
                maxLength: 500
                pattern: '^(/|https://)'
              alt: { type: string, minLength: 1, maxLength: 200 }
        variants:
          type: array
          maxItems: 30
          items:
            type: object
            required: [name, sku, stock]
            properties:
              name: { type: string, maxLength: 80 }
              sku: { type: string, maxLength: 60 }
              price: { type: [integer, 'null'], minimum: 0 }
              stock: { type: integer, minimum: 0, maximum: 1000000 }
    ProductUpdate:
      type: object
      additionalProperties: true
      description: Any subset of ProductInput fields; the server validates the provided fields.
    CategoryInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        slug: { type: string, maxLength: 80 }
        description: { type: string, maxLength: 300 }
        sortOrder: { type: integer }
        isActive: { type: boolean }
    CouponInput:
      type: object
      required: [code, kind, value]
      properties:
        code: { type: string, maxLength: 40 }
        kind: { type: string, enum: [percent, fixed, free_shipping] }
        value: { type: integer, minimum: 0, description: Percent (1000 = 10%) or paise for fixed }
        minSubtotal: { type: integer, minimum: 0 }
        maxDiscount: { type: [integer, 'null'], minimum: 0 }
        startsAt: { type: [string, 'null'], format: date-time }
        endsAt: { type: [string, 'null'], format: date-time }
        usageLimit: { type: [integer, 'null'], minimum: 1 }
        perEmailLimit: { type: integer, minimum: 1, default: 1 }
        firstOrderOnly: { type: boolean }
        isActive: { type: boolean }
    ZoneInput:
      type: object
      required: [name, pincodes, fee]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        pincodes:
          type: string
          description: Comma/space separated 6-digit PINs and `start-end` ranges
        fee: { type: integer, minimum: 0 }
        freeAbove: { type: [integer, 'null'], minimum: 0 }
        etaDaysMin: { type: integer, minimum: 0 }
        etaDaysMax: { type: integer, minimum: 0 }
        isActive: { type: boolean }
        sortOrder: { type: integer }
